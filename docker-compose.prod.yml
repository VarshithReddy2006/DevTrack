# docker-compose.prod.yml — Production deployment topology
# Splits the monolith into isolated services for blast-radius containment.
#
# Services:
#   api            — Express HTTP server + SSE gateway (no workers)
#   frontend       — Nginx serving the built SPA, proxies /api to the api service
#   worker-sync    — Platform sync BullMQ worker
#   worker-xp      — XP processing BullMQ worker
#   worker-resume  — Resume intelligence consumers
#   worker-dataset — Dataset ingestion consumer
#   worker-maint   — Maintenance/cleanup worker
#   redis          — Redis 7 for queues, caching, SSE pub/sub
#   mongo          — MongoDB 7 for persistent storage
#
# Each worker container runs worker-entrypoint.ts with WORKER_TYPE set to
# the appropriate value. The API container runs the main index.ts with
# ENABLE_WORKERS=false so no BullMQ workers compete with HTTP handlers.

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env.production
      required: false
  depends_on:
    redis:
      condition: service_healthy
    mongo:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - devtrack

services:
  # ─── API Server ─────────────────────────────────────────────────────────
  api:
    <<: *backend-base
    command: ["node", "dist/index.js"]
    ports:
      - "${API_PORT:-4000}:3001"
    environment:
      - ENABLE_WORKERS=false
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USER:-devtrack}:${MONGO_PASS:-devtrack}@mongo:27017/devtrack?authSource=admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      devtrack:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ─── Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in the environment or .env.production}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - devtrack

  # ─── Sync Worker ────────────────────────────────────────────────────────
  worker-sync:
    <<: *backend-base
    command: ["node", "dist/worker-entrypoint.js"]
    environment:
      - WORKER_TYPE=sync
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USER:-devtrack}:${MONGO_PASS:-devtrack}@mongo:27017/devtrack?authSource=admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── XP Worker ──────────────────────────────────────────────────────────
  worker-xp:
    <<: *backend-base
    command: ["node", "dist/worker-entrypoint.js"]
    environment:
      - WORKER_TYPE=xp
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USER:-devtrack}:${MONGO_PASS:-devtrack}@mongo:27017/devtrack?authSource=admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── Resume Intelligence Workers ────────────────────────────────────────
  worker-resume:
    <<: *backend-base
    command: ["node", "dist/worker-entrypoint.js"]
    environment:
      - WORKER_TYPE=resume-intelligence
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USER:-devtrack}:${MONGO_PASS:-devtrack}@mongo:27017/devtrack?authSource=admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── Dataset Ingestion Worker ───────────────────────────────────────────
  worker-dataset:
    <<: *backend-base
    command: ["node", "dist/worker-entrypoint.js"]
    environment:
      - WORKER_TYPE=dataset
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USER:-devtrack}:${MONGO_PASS:-devtrack}@mongo:27017/devtrack?authSource=admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── Maintenance Worker ─────────────────────────────────────────────────
  worker-maint:
    <<: *backend-base
    command: ["node", "dist/worker-entrypoint.js"]
    environment:
      - WORKER_TYPE=maintenance
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USER:-devtrack}:${MONGO_PASS:-devtrack}@mongo:27017/devtrack?authSource=admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ─── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'
    networks:
      - devtrack

  # ─── MongoDB ────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-devtrack}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:-devtrack}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - devtrack

volumes:
  redis_data:
  mongo_data:

networks:
  devtrack:
    driver: bridge
