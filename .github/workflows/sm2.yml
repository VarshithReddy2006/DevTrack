name: SM-2 Package

on:
  pull_request:
    paths:
      - 'packages/sm2/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sm2.yml'
  push:
    branches: [main]
    paths:
      - 'packages/sm2/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sm2.yml'

jobs:
  sm2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test -w @devtrack/sm2
      - run: npm run build -w @devtrack/sm2
