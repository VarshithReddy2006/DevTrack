name: PR Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - fix/ci-repository-recovery
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Fail Fast Checks (Lint, Typecheck & Build) ─────────────────────────────
  static-checks:
    name: Static Checks & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck Backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npx tsc -b --noEmit

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  # ── Unit Tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm run test:unit --if-present

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm run test:unit --if-present

  # ── Integration Tests (Requires DB) ────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: static-checks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      JWT_SECRET: test-secret-key-12345
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Verify registered Readiness and Resume consumers
        working-directory: ./backend
        env:
          WORKER_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: node node_modules/vitest/vitest.mjs run -c vitest.worker-queues.config.ts

      - name: Run Integration Tests
        working-directory: ./backend
        run: npm run test:integration --if-present

  # ── Docker Build Verification ──────────────────────────────────────────────
  docker-verify:
    name: Docker Build Verification
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Backend Docker Build
        run: docker build -f backend/Dockerfile -t devtrack-backend:test .

      - name: Verify Frontend Docker Build
        working-directory: ./frontend
        run: docker build -t devtrack-frontend:test .

  resume-e2e:
    name: Resume browser flow
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Typecheck E2E harness
        run: |
          node backend/node_modules/typescript/bin/tsc -p backend/tsconfig.e2e.json
          node frontend/node_modules/typescript/bin/tsc -p frontend/tsconfig.e2e.json

      - name: Run resume browser flow
        run: npm run test:e2e:resume --prefix frontend

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
